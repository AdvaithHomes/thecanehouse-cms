<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2300" viewBox="0 0 1500 2300">
  <!-- Large, light, irregular browning for aged paper. A big tile (1500×2300)
       so the patches look random on screen. Kept faint on purpose. -->
  <filter id="b" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0016 0.0012" numOctaves="4" seed="57" stitchTiles="stitch" result="n"/>
    <!-- only the darker parts of the noise become soft tea-brown patches -->
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.55
              0 0 0 0 0.35
              0 0 0 0 0.12
              -2.2 0 0 0 1.25"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55" intercept="0"/>
    </feComponentTransfer>
  </filter>
  <rect width="1500" height="2300" filter="url(#b)"/>
</svg>
