<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <!-- Worn texture for DARK panels (the green footer): light chalky flecks,
       fine grain and soft uneven patches, like old painted wood. Seamless. -->
  <filter id="w" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <!-- soft uneven light/dark patches -->
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="12" stitchTiles="stitch" result="m"/>
    <feColorMatrix in="m" type="matrix" result="patch"
      values="0 0 0 0 0.96
              0 0 0 0 0.9
              0 0 0 0 0.76
              0.9 0 0 0 -0.38"/>
    <!-- fine grain all over -->
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" stitchTiles="stitch" result="g"/>
    <feColorMatrix in="g" type="matrix" result="grain"
      values="0 0 0 0 0.96
              0 0 0 0 0.9
              0 0 0 0 0.76
              1.1 0 0 0 -0.48"/>
    <!-- sparse chalky flecks / scratches -->
    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.9" numOctaves="2" seed="21" stitchTiles="stitch" result="s"/>
    <feColorMatrix in="s" type="matrix" result="fleck"
      values="0 0 0 0 0.98
              0 0 0 0 0.94
              0 0 0 0 0.82
              5 0 0 0 -3.3"/>
    <feComposite in="grain" in2="patch" operator="over" result="a"/>
    <feComposite in="fleck" in2="a" operator="over"/>
  </filter>
  <rect width="420" height="420" filter="url(#w)"/>
</svg>
